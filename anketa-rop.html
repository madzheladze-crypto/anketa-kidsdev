:root{
  --team:#576264;--career:#5eb043;--school:#e8484d;--events:#ffd854;--club:#64c1c6;--camp:#29401e;--franchise:#1e50b4;
  --bg:#f5f7f7;--surface:#ffffff;--ink:#0b0f12;--muted:#576264;--line:#dce1e2;--soft:#eceff0;
  --accent:#1e50b4;--on-ink:#ffffff;--error:#c9303a;
  --display:"KD Form","Montserrat",system-ui,sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0d1113;--surface:#151a1d;--ink:#eef1f2;--muted:#9aa6a8;--line:#2a3236;--soft:#1d2427;
  --accent:#6b93ef;--on-ink:#0b0f12;--error:#ff7479;--team:#8a989b}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0d1113;--surface:#151a1d;--ink:#eef1f2;--muted:#9aa6a8;--line:#2a3236;--soft:#1d2427;
  --accent:#6b93ef;--on-ink:#0b0f12;--error:#ff7479;--team:#8a989b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:24px 8px}
.logo{height:22px;width:auto;color:var(--ink);display:block}
.tag{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px}
.hero{padding-block:36px 28px}
.stripe{display:flex;gap:6px;margin-bottom:28px}
.stripe i{height:10px;flex:1;border-radius:999px;background:var(--c)}
h1{font:700 clamp(34px,7vw,56px)/1.02 var(--display);letter-spacing:-.01em;margin:0 0 18px;text-wrap:balance}
.lead{font-size:17px;max-width:58ch;margin:0 0 20px;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta>span{font:600 12px/1 var(--body);background:var(--soft);color:var(--muted);border-radius:999px;padding:9px 14px;font-variant-numeric:tabular-nums}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding-block:12px;margin-inline:-20px;padding-inline:20px;border-bottom:1px solid var(--line)}
.progress-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.segs{display:flex;gap:5px;flex:1}
.segs b{height:6px;flex:1;border-radius:999px;background:var(--line);transition:background .3s}
.segs b.done{background:var(--c)}
.count{font:600 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
section.block{padding-block:44px 8px}
.bhead{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:26px}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--c);color:var(--pc,#fff);border-radius:999px;padding:9px 20px 8px;font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.bhead p{margin:0;color:var(--muted);max-width:60ch}
.q{padding-block:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.q[hidden]{display:none!important}
.qlabel{display:flex;gap:12px;align-items:baseline;font:600 16px/1.4 var(--body);margin:0}
.qnum{font:600 12px/1 var(--body);color:var(--muted);min-width:28px;font-variant-numeric:tabular-nums;flex:none}
.req{color:var(--school)}
.hint{margin:-4px 0 0 40px;color:var(--muted);font-size:13px}
.field{margin-left:40px;display:flex;flex-direction:column;gap:10px}
input[type=text],input[type=tel],input[type=number],input[type=email],textarea,select{
  width:100%;font:500 15px/1.4 var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;transition:border-color .15s}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 55%,calc(100% - 16px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px}
textarea{min-height:104px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font:500 14px/1.25 var(--body);cursor:pointer;transition:background .15s,border-color .15s,color .15s;user-select:none}
.opt.multi span::before{content:"";width:14px;height:14px;border:1.5px solid var(--muted);border-radius:4px;flex:none}
.opt.multi input:checked+span::before{background:var(--on-ink);border-color:var(--on-ink);box-shadow:inset 0 0 0 2.5px var(--ink)}
.opt:hover span{border-color:var(--muted)}
.opt input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;max-width:calc(var(--n) * var(--w))}
.scale .opt span{width:100%;justify-content:center;padding:12px 0;font-weight:600;font-variant-numeric:tabular-nums}
.anchors{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);max-width:calc(var(--n) * var(--w))}
.anchors span:last-child{text-align:right}
.other{display:none}
.other.on{display:block}
.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.err{display:none;color:var(--error);font-size:13px;font-weight:600}
.q.bad .err{display:block}
.q.bad input[type=text],.q.bad input[type=tel],.q.bad input[type=number],.q.bad input[type=email],.q.bad textarea,.q.bad select{border-color:var(--error)}
.submit{margin-top:40px;padding-top:32px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
button.send{font:700 17px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;padding:20px 34px 18px;cursor:pointer;transition:transform .15s,opacity .15s}
button.send:hover{transform:translateY(-1px)}
button.send:disabled{opacity:.5;cursor:progress;transform:none}
button.send:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.formerr{color:var(--error);font-weight:600;font-size:14px}
.note{font-size:12px;color:var(--muted);max-width:60ch;margin:0}
.done{padding-block:72px 40px}
.done h2{font:700 clamp(32px,6vw,48px)/1.05 var(--display);margin:24px 0 16px}
.done p{font-size:17px;max-width:52ch;margin:0}
@media (max-width:520px){
  .field,.hint{margin-left:0}
  .qlabel{flex-direction:column;gap:6px}
  .scale{gap:4px}.scale .opt span{padding:11px 0;font-size:13px}
  .opt span{padding:9px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

L108.438 25.661 Z"/><path d="M121.459 25.661 L124.12 25.661 L128.65 38.3065 L133.159 25.661 L135.843 25.661 L130.322 41.0565 L126.979 41.0565 L121.459 25.661 Z"/></g></svg>

<script>
/* ===== Настройки =====

   Если форма открыта по ссылке самого Apps Script (doGet), SCRIPT_URL не нужен.

const SPEC = {

     ]
    },
    {

     "label": "Согласие на обработку персональных данных",

     "type": "consent",

    }
   ]
  }
 ]

/* ===================== */


const COLORS = {team:"var(--team)",career:"var(--career)",school:"var(--school)",events:"var(--events)",club:"var(--club)",camp:"var(--camp)",franchise:"var(--franchise)"};
const DARK_TEXT = {events:1,club:1};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function stripe(el){ el.innerHTML = SPEC.blocks.map(b=>`<i style="--c:${COLORS[b.color]}"></i>`).join(""); }

function render(){
  $("#tag").textContent = SPEC.tag;
  $("#h1").textContent = SPEC.title;
  $("#lead").textContent = SPEC.intro;
  $("#outro").textContent = SPEC.outro;
  const total = SPEC.blocks.reduce((n,b)=>n+b.questions.length,0);
  $("#meta").innerHTML = `<span>${SPEC.time}</span><span>${total} ${plural(total,"вопрос","вопроса","вопросов")}</span><span><span class="req">*</span> обязательные</span>`;
  stripe($("#stripe")); stripe($("#stripe2"));
  $("#segs").innerHTML = SPEC.blocks.map((b,i)=>`<b id="seg${i}" style="--c:${COLORS[b.color]}"></b>`).join("");
  $("#form").innerHTML = SPEC.blocks.map((b,bi)=>`
    <section class="block" id="block${bi}">
      <div class="bhead">
        <span class="pill" style="--c:${COLORS[b.color]};${DARK_TEXT[b.color]?"--pc:#0b0f12":""}">Блок ${bi+1} · ${esc(b.title)}</span>
        ${b.note?`<p>${esc(b.note)}</p>`:""}
      </div>
      ${b.questions.map(q=>question(q)).join("")}
    </section>`).join("") + `
    <div class="submit">
      <button type="submit" class="send" id="send">Отправить анкету</button>
      <div class="formerr" id="formerr" hidden></div>
      <p class="note">Нажимая «Отправить», вы подтверждаете, что данные указаны верно.</p>
    </div>`;
}

function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;}

function question(q){
  const id="q"+q.n.replace(".","_");
  const star=q.req?' <span class="req" aria-label="обязательный">*</span>':"";
  let f="";
  if(q.type==="text"||q.type==="tel"||q.type==="number"||q.type==="email"){
    const t=q.type==="number"?'number" inputmode="numeric" min="1" max="18':q.type;
    f=`<input type="${t}" id="${id}" name="${id}" placeholder="${esc(q.ph||"")}" autocomplete="${q.ac||"off"}">`;
  } else if(q.type==="long"){
    f=`<textarea id="${id}" name="${id}" placeholder="${esc(q.ph||"")}"></textarea>`;
  } else if(q.type==="select"){
    f=`<select id="${id}" name="${id}"><option value="">Выберите</option>${q.opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`+otherField(q,id);
  } else if(q.type==="one"||q.type==="many"){
    const it=q.type==="one"?"radio":"checkbox";
    f=`<div class="opts">${q.opts.map((o,i)=>`<label class="opt ${q.type==="many"?"multi":""}"><input type="${it}" id="${id}_${i}" name="${id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`+otherField(q,id);
  } else if(q.type==="scale"){
    const vals=[];for(let v=q.min;v<=q.max;v++)vals.push(v);
    f=`<div class="opts scale" style="--n:${vals.length};--w:${vals.length>6?62:96}px">${vals.map(v=>`<label class="opt"><input type="radio" id="${id}_${v}" name="${id}" value="${v}" aria-label="${v}"><span>${v}</span></label>`).join("")}</div>
       <div class="anchors" style="--n:${vals.length};--w:${vals.length>6?62:96}px"><span>${esc(q.lo)}</span><span>${esc(q.hi)}</span></div>`;
  } else if(q.type==="consent"){
    f=`<label class="consent"><input type="checkbox" id="${id}" name="${id}" value="Да"><span>${esc(q.text)}</span></label>`;
  }
  const hidden=q.showIf?" hidden":"";
  return `<div class="q${hidden}" id="w_${id}" data-n="${q.n}"${q.showIf?` data-show="${esc(JSON.stringify(q.showIf))}"`:""}>
    <p class="qlabel"><span class="qnum">${q.n}</span><span>${esc(q.label)}${star}</span></p>
    ${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
    <div class="field">${f}<div class="err" role="alert">${esc(q.err||defaultErr(q))}</div></div>
  </div>`;
}
function otherField(q,id){
  if(!q.other) return "";
  return `<input type="text" class="other" id="${id}_other" name="${id}_other" placeholder="${esc(q.otherPh||"Уточните")}" data-trigger="${esc(q.other)}">`;
}
function defaultErr(q){
  return {one:"Выберите один вариант",many:"Отметьте хотя бы один вариант",scale:"Поставьте оценку",consent:"Без согласия мы не сможем принять анкету",select:"Выберите вариант",tel:"Укажите телефон, например +7 900 123-45-67",number:"Укажите возраст цифрами",email:"Укажите email, например name@mail.ru"}[q.type]||"Заполните это поле";
}

const allQ = () => SPEC.blocks.flatMap(b=>b.questions);
const qid = q => "q"+q.n.replace(".","_");

function value(q){
  const id=qid(q);
  if(q.type==="one"||q.type==="scale"){const c=document.querySelector(`input[name="${id}"]:checked`);return c?c.value:"";}
  if(q.type==="many"){return [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(c=>c.value);}
  if(q.type==="consent"){return $("#"+id).checked?"Да":"";}
  return ($("#"+id).value||"").trim();
}
function withOther(q){
  let v=value(q);
  if(q.other){
    const o=$("#"+qid(q)+"_other"), ot=(o.value||"").trim();
    if(Array.isArray(v)) v=v.map(x=>x===q.other&&ot?`${x}: ${ot}`:x);
    else if(v===q.other&&ot) v=`${v}: ${ot}`;
  }
  return Array.isArray(v)?v.join("; "):v;
}
function visible(q){ return !$("#w_"+qid(q)).hidden; }
function answered(q){ const v=value(q); return Array.isArray(v)?v.length>0:v!==""; }
function valid(q){
  if(!visible(q)) return true;
  if(q.req&&!answered(q)) return false;
  const v=value(q);
  if(q.type==="tel"&&v&&v.replace(/\D/g,"").length<10) return false;
  if(q.type==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return false;
  if(q.type==="number"&&v&&!(+v>=1&&+v<=18)) return false;
  return true;
}

function refresh(){
  // условные вопросы
  document.querySelectorAll(".q[data-show]").forEach(w=>{
    const c=JSON.parse(w.dataset.show); const src=allQ().find(q=>q.n===c.q);
    const v=value(src); const on=c.in.some(x=>Array.isArray(v)?v.includes(x):v===x);
    w.hidden=!on;
  });
  // поле «другое»
  document.querySelectorAll(".other").forEach(o=>{
    const q=allQ().find(q=>qid(q)+"_other"===o.id); const v=value(q);
    o.classList.toggle("on", Array.isArray(v)?v.includes(o.dataset.trigger):v===o.dataset.trigger);
  });
  // прогресс по блокам
  let doneQ=0,totalQ=0;
  SPEC.blocks.forEach((b,i)=>{
    const vis=b.questions.filter(visible), req=vis.filter(q=>q.req);
    const ok=(req.length?req:vis).every(q=>answered(q));
    $("#seg"+i).classList.toggle("done",ok);
    totalQ+=vis.length; doneQ+=vis.filter(answered).length;
  });
  $("#count").textContent=`${doneQ} из ${totalQ}`;
}

function bind(){
  const form=$("#form");
  form.addEventListener("input",e=>{ const w=e.target.closest(".q"); if(w&&w.classList.contains("bad")){const q=allQ().find(q=>"w_"+qid(q)===w.id); if(valid(q)) w.classList.remove("bad");} refresh(); });
  form.addEventListener("change",()=>refresh());
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    let first=null;
    allQ().forEach(q=>{ const w=$("#w_"+qid(q)); const ok=valid(q); w.classList.toggle("bad",!ok); if(!ok&&!first) first=w; });
    const fe=$("#formerr");
    if(first){ fe.textContent="Проверьте отмеченные вопросы"; fe.hidden=false; first.scrollIntoView({behavior:"smooth",block:"center"}); const inp=first.querySelector("input,textarea,select"); if(inp) inp.focus({preventScroll:true}); return; }
    fe.hidden=true;
    const data=new URLSearchParams(); const order=["Анкета","Дата отправки"];
    data.append("Анкета",SPEC.formName);
    data.append("Дата отправки",new Date().toLocaleString("ru-RU"));
    allQ().forEach(q=>{ const k=`${q.n} ${q.col}`; order.push(k); data.append(k, visible(q)?withOther(q):""); });
    data.append("_order",JSON.stringify(order));
    const btn=$("#send"); btn.disabled=true; btn.textContent="Отправляем…";
    try{
      const gs=window.google&&google.script&&google.script.run;
      if(gs){ // форма открыта со ссылки Apps Script — пишем в таблицу напрямую
        const obj={}; data.forEach((v,k)=>obj[k]=v);
        await new Promise((ok,fail)=>google.script.run.withSuccessHandler(ok).withFailureHandler(fail).saveAnswer(obj));
      } else if(SCRIPT_URL) await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:data});
      $("#app").hidden=true; $("#done").hidden=false; window.scrollTo({top:0});
    }catch(err){
      btn.disabled=false; btn.textContent="Отправить анкету";
      fe.textContent="Не получилось отправить: проверьте интернет и нажмите ещё раз."; fe.hidden=false;
    }
  });
}

render(); bind(); refresh();
</script>

</body>
</html>
