<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Я — Предприниматель | KidsDev Academy</title><style>
:root{font-family:Montserrat,Arial,sans-serif;color:#17223c;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:35px auto;padding:24px}.panel{background:white;padding:32px;border-radius:24px;box-shadow:0 12px 45px #1d36621a}.brand{font-weight:900;color:#235edb;letter-spacing:2px}h1{font-size:clamp(30px,6vw,48px);margin:16px 0}h2{font-size:24px}p{line-height:1.65}.muted{color:#60718d}.progress{height:7px;background:#e8edf7;border-radius:9px;overflow:hidden;margin:24px 0}.bar{height:100%;background:#3475ef;transition:width .3s}.choice{display:block;padding:14px 16px;margin:9px 0;border:1px solid #d9e3f4;border-radius:12px;cursor:pointer}.choice:has(input:checked){border-color:#3475ef;background:#eff5ff}input[type=text],input[type=tel],textarea{width:100%;border:1px solid #cbd8eb;border-radius:12px;padding:14px;font:inherit}textarea{min-height:110px}button{border:0;background:#2867e5;color:white;padding:14px 24px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e8eefb;color:#21416f}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.error{color:#b42318;margin-top:10px}.small{font-size:13px}.hidden{display:none}@media(max-width:600px){.wrap{padding:12px;margin:12px auto}.panel{padding:22px}}
</style></head><body><main class="wrap"><div class="panel"><div class="brand">KIDSDEV ACADEMY</div><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><div id="page"></div><div class="actions" id="actions"><button class="secondary" id="back" type="button">Назад</button><button id="next" type="button">Продолжить</button></div><div id="error" class="error" role="alert"></div></div></main>
<script>
const questions=[
["Сколько лет вашему ребёнку?","single",["7–9 лет","10–12 лет","13–17 лет","Другой возраст (укажите)"]],
["Как зовут ребёнка?","text"],
["Чем ребёнок увлекается сейчас?","multi",["Рисование, дизайн, творчество","Компьютеры, игры, программирование","Спорт","Музыка, видео, контент","Рукоделие, поделки, продажа своих изделий","Общение, организация мероприятий","Пока сложно сказать","Другое: ______"]],
["Есть ли у ребёнка идея, которую он хотел бы превратить в проект?","single",["Да, уже есть конкретная идея","Есть несколько идей, но не знает, с чего начать","Идей пока нет — хотим найти её на курсе","Затрудняюсь ответить"]],
["Пробовал ли ребёнок зарабатывать или что-то продавать?","single",["Да, есть опыт (расскажите кратко: ______)","Нет, но очень хочет попробовать","Нет, и пока не стремится"]],
["Что для вас важнее всего в результате курса?","multi",["Свой бизнес-проект и защита на Demo Day","Профориентация: понять, чем ребёнок хочет заниматься","Навыки презентации и публичных выступлений","Портфолио для поступления в вуз","Новые знакомства и окружение","Уверенность и самостоятельность ребёнка","Другое: ______"]],
["Насколько для вас актуален формат очных занятий в Москве?","single",["Полностью подходит","Подходит, но важны даты и расписание","Рассматриваем только онлайн","Пока не знаю"]],
["Ваше имя","text"],["Номер телефона / WhatsApp","tel"],["Telegram для связи","text",[],false],
["Когда вам удобно созвониться?","single",["Утро (9:00–12:00)","День (12:00–17:00)","Вечер (17:00–20:00)","В выходные","Напишите удобное время и дату: ______"]],
["Удобно ли вам, чтобы мы написали в WhatsApp/Telegram в течение 24 часов и предложили время консультации?","single",["Да, удобно","Да, но лучше позже (укажите когда: ______)","Предпочитаю, чтобы я сам(а) написал(а) вам"]],
["Есть ли вопрос, который вы хотите обсудить на консультации?","textarea",[],false],
["Я согласен(на) на обработку персональных данных и получение сообщений о программе «Я — Предприниматель»","consent"]
];let step=-1;const answers={};const page=document.querySelector("#page"),error=document.querySelector("#error"),bar=document.querySelector("#bar"),actions=document.querySelector("#actions");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){error.textContent="";bar.style.width=Math.round((step+1)/(questions.length+1)*100)+"%";document.querySelector("#back").style.visibility=step<0?"hidden":"visible";document.querySelector("#next").textContent=step===questions.length-1?"Отправить заявку":"Продолжить";
if(step===-1){page.innerHTML='<h1>Я — Предприниматель 🚀</h1><h2>Бесплатная индивидуальная консультация</h2><p>Здравствуйте! Вы на шаге, который может изменить будущее вашего ребёнка.</p><p>Вы оставляете заявку на бесплатную индивидуальную консультацию по программе «Я — Предприниматель» — бизнес-курсу для школьников 7–17 лет от KidsDev Academy.</p><p>За 4 месяца ребёнок проходит путь от идеи до собственного бизнес-проекта и защищает его на Demo Day перед экспертами. Программа включает 15 очных занятий, 2 бизнес-экскурсии и 16 тем.</p><p>Заполнение анкеты займёт 2–3 минуты. Мы свяжемся с вами в WhatsApp/Telegram в течение 24 часов и предложим время консультации. Заполнение ни к чему не обязывает.</p>';return}
const q=questions[step],v=answers[step],type=q[1];let html='<div class="muted small">Вопрос '+(step+1)+' из '+questions.length+'</div><h2>'+esc(q[0])+'</h2>';
if(type==="single"||type==="multi"){html+=q[2].map((opt,i)=>'<label class="choice"><input type="'+(type==="single"?"radio":"checkbox")+'" name="answer" value="'+esc(opt)+'" '+(type==="multi"?(Array.isArray(v)&&v.includes(opt)?"checked":""):(v===opt?"checked":""))+'> '+esc(opt)+'</label>').join("");if(q[2].some(x=>/укажите|Другое|расскажите|Напишите/.test(x)))html+='<input type="text" id="extra" placeholder="Уточните ответ, если необходимо" value="'+esc(answers["extra"+step]||"")+'">'}
else if(type==="consent")html+='<label class="choice"><input id="answer" type="checkbox" '+(v?"checked":"")+'> Подтверждаю согласие</label>';
else if(type==="textarea")html+='<textarea id="answer" placeholder="Ваш ответ">'+esc(v||"")+'</textarea>';
else html+='<input id="answer" type="'+type+'" value="'+esc(v||"")+'" placeholder="Ваш ответ">';
page.innerHTML=html}
function save(){if(step<0)return true;const q=questions[step],t=q[1];let v;if(t==="single")v=page.querySelector('input[name="answer"]:checked')?.value||"";else if(t==="multi")v=[...page.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value);else if(t==="consent")v=page.querySelector("#answer").checked;else v=page.querySelector("#answer").value.trim();if(q[3]!==false&&(!v||(Array.isArray(v)&&!v.length))){error.textContent="Пожалуйста, ответьте на вопрос";return false}answers[step]=v;if(page.querySelector("#extra"))answers["extra"+step]=page.querySelector("#extra").value.trim();return true}
document.querySelector("#back").onclick=()=>{save();step--;render()};document.querySelector("#next").onclick=async()=>{if(!save())return;if(step<questions.length-1){step++;render();return}error.textContent="Подключение Google Таблицы ещё не завершено. Заявка пока не отправлена. Пожалуйста, попробуйте позже.";};render();
</script></body></html>
